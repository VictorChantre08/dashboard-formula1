<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel F1 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: abas por assunto, filtro de rodadas em uma linha acima do conteúdo, cards de gráfico sobre fundo neutro.
   Cor só nos dados: UI em tons de tinta; série 1-8 = pilotos do top 8; azul sequencial = magnitude. */
:root{
  color-scheme:light;
  --plane:#f5f5f2; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --tick:#6b6a65;
  --line:#e1e0d9; --axis:#c3c2b7; --hover:#f1f0ec; --chip:#efeee9; --shadow:0 8px 28px rgba(11,11,11,.14);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --seq:#2a78d6; --seq-lo:#cde2fb; --seq-hi:#184f95; --db-from:#86b6ef; --db-to:#1c5cab;
  --on-hi:#ffffff; --on-lo:#0b0b0b; --cell0:#eeede8; --other:#a9a79e;
  --good:#006300; --crit:#d03b3b; --good-bg:#e6f2e6;
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --tick:#9a988f;
    --line:#2c2c2a; --axis:#383835; --hover:#222221; --chip:#262624; --shadow:0 8px 28px rgba(0,0,0,.5);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --seq:#3987e5; --seq-lo:#0d366b; --seq-hi:#86b6ef; --db-from:#1c5cab; --db-to:#9ec5f4;
    --on-hi:#0b0b0b; --on-lo:#f0efec; --cell0:#242422; --other:#6b6a65;
    --good:#0ca30c; --crit:#e66767; --good-bg:#12301a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --tick:#9a988f;
  --line:#2c2c2a; --axis:#383835; --hover:#222221; --chip:#262624; --shadow:0 8px 28px rgba(0,0,0,.5);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --seq:#3987e5; --seq-lo:#0d366b; --seq-hi:#86b6ef; --db-from:#1c5cab; --db-to:#9ec5f4;
  --on-hi:#0b0b0b; --on-lo:#f0efec; --cell0:#242422; --other:#6b6a65;
  --good:#0ca30c; --crit:#e66767; --good-bg:#12301a;
}
body{background:var(--plane);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.app{max-width:1240px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

/* cabeçalho */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;padding-bottom:18px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}
h1{margin:4px 0 0;font-size:clamp(26px,4.4vw,36px);line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.meta{font-size:12.5px;color:var(--ink2);text-align:right}
.meta b{color:var(--ink);font-weight:600}
@media (max-width:640px){.meta{text-align:left}}

/* abas */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;margin-bottom:-1px;color:var(--ink2);font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

/* filtros */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:16px 0 18px}
.filters[hidden]{display:none}
.f-group{display:flex;align-items:center;gap:8px}
.f-label{font-size:12px;color:var(--ink2);font-weight:500}
select{appearance:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:190px}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg-ctl button{appearance:none;background:none;border:0;padding:6px 11px;cursor:pointer;color:var(--ink2);font-size:13px;border-right:1px solid var(--line)}
.seg-ctl button:last-child{border-right:0}
.seg-ctl button:hover{background:var(--hover)}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.range-note{font-size:12.5px;color:var(--ink2)}

/* grades e cards */
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1.95fr)}
.g-main{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.g-half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:960px){.g-hero,.g-main,.g-half{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card h2{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.005em}
.card .sub{margin:2px 0 0;color:var(--ink2);font-size:12.5px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px;margin-bottom:12px}
.chart-box{width:100%;min-width:0}
svg.chart{display:block;max-width:100%;overflow:visible}
svg text{font-family:var(--font)}
.gl{stroke:var(--line);stroke-width:1}
.axl{stroke:var(--axis);stroke-width:1}
.tk{fill:var(--tick);font-size:11px}
.tk-strong{fill:var(--ink);font-size:12px}
.ln{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
.cross{stroke:var(--axis);stroke-width:1}
.hit{fill:transparent;touch-action:pan-y}
.lbl{fill:var(--ink);font-size:12px;font-weight:600}

/* hero */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .who{font-size:20px;font-weight:650;letter-spacing:-.01em;margin-top:6px}
.hero .team{color:var(--ink2);font-size:13px}
.hero-num{font-size:clamp(56px,8vw,76px);font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:10px}
.hero-num small{font-size:18px;font-weight:500;letter-spacing:0;color:var(--ink2);margin-left:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-bg);border-color:transparent;color:var(--good);font-weight:600}
.pill svg{flex:none}
.hero-foot{margin-top:auto;padding-top:14px;color:var(--ink2);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:2px;padding:16px 18px}
.tile .k{font-size:12px;color:var(--ink2);font-weight:500}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.tile .v small{font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:0}
.tile .d{font-size:12.5px;color:var(--ink2)}
@media (max-width:520px){.tiles{grid-template-columns:minmax(0,1fr)}}

/* chips de pilotos */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{appearance:none;display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--ink2)}
.chip:hover{background:var(--hover)}
.chip i{width:14px;height:3px;border-radius:2px;background:var(--c);flex:none}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--axis);background:var(--chip);font-weight:600}
.chip[aria-pressed="false"] i{opacity:.35}

/* tabelas */
.tw{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--axis);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[tabindex]{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr.sel{background:var(--chip)}
.th-btn{appearance:none;background:none;border:0;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:inherit;cursor:pointer}
.th-btn:hover{color:var(--ink)}
.th-btn.on{color:var(--ink)}
.name{font-weight:600}
.under{display:block;color:var(--ink2);font-size:12px;font-weight:400}
.posb{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:6px;background:var(--chip);font-weight:650;font-variant-numeric:tabular-nums;font-size:12.5px}
.posb.p1{background:var(--ink);color:var(--surface)}
.ptsbar{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.ptsbar span.b{display:block;height:6px;border-radius:3px;background:var(--seq);min-width:2px}
.gain{font-variant-numeric:tabular-nums;white-space:nowrap}
.gain.up{color:var(--good)}
.gain.dn{color:var(--crit)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--chip);color:var(--ink2);letter-spacing:.03em}
.tag.s{background:var(--ink);color:var(--surface)}
.tag.warn{color:var(--crit)}
.muted{color:var(--ink2)}
.dash{color:var(--tick)}

/* segmented bar */
.segbar{display:flex;gap:2px;height:28px}
.seg{display:flex;align-items:center;padding-left:8px;min-width:0;border-radius:4px;background:var(--c);color:#fff;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;overflow:visible;white-space:nowrap}
.seg[data-slot="4"]{color:#0b0b0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg[data-slot="4"]{color:#fff}}
:root[data-theme="dark"] .seg[data-slot="4"]{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

/* lista de pódios */
.pod{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pod:last-child{border-bottom:0}
.pod .rr{font-variant-numeric:tabular-nums;font-weight:650;font-size:12.5px;color:var(--ink2);min-width:30px}
.pod .gp{font-weight:600;min-width:0}
.pod .tri{display:flex;gap:6px;font-variant-numeric:tabular-nums;font-size:12.5px}
.pod .tri b{font-weight:650}
.pod .tri span{color:var(--ink2)}

/* pódio de uma corrida */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.pb{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.pb .pp{font-size:11px;letter-spacing:.06em;color:var(--ink2);font-weight:600}
.pb .nm{font-weight:650;margin-top:2px;overflow-wrap:anywhere}
.pb .tm{font-size:12px;color:var(--ink2)}
.pb .gp2{font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.pb.first{background:var(--chip)}
@media (max-width:520px){.podium{grid-template-columns:minmax(0,1fr)}}

/* tooltip */
.tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:10px;padding:9px 11px;font-size:12.5px;box-shadow:var(--shadow);max-width:290px;min-width:150px}
.tip[hidden]{display:none}
.tip .th{font-weight:650;margin-bottom:1px}
.tip .ts{color:var(--ink2);font-size:12px;margin-bottom:6px}
.tip .tr{display:flex;align-items:center;gap:8px;padding:1.5px 0}
.tip .tr i{width:12px;height:3px;border-radius:2px;background:var(--c,var(--ink2));flex:none}
.tip .tr .l{color:var(--ink2);flex:1;min-width:0}
.tip .tr .v{font-weight:650;font-variant-numeric:tabular-nums;margin-left:12px}

.card h3{margin:20px 0 0;font-size:13.5px;font-weight:650;border-top:1px solid var(--line);padding-top:16px}
.card h3 + .sub{margin-bottom:10px}
.cust{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:12.5px;color:var(--ink2)}
.cust b{color:var(--ink);font-weight:600}
.note{margin:12px 0 0;color:var(--ink2);font-size:12.5px;max-width:78ch}
.err{padding:28px;text-align:center;color:var(--ink2)}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink2);font-size:12.5px;display:grid;gap:4px}
footer a{color:var(--ink)}
.empty{padding:22px;text-align:center;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.tab,.chip,.seg-ctl button{transition:background-color .12s,color .12s}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow">Fórmula 1 · Painel de dados</div>
      <h1>Temporada 2026</h1>
    </div>
    <div class="meta" id="meta" aria-live="polite">Carregando dados…</div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Seções do painel" id="tabs"></nav>
  <div class="filters" id="filters" aria-label="Filtro de rodadas"></div>
  <main id="view" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<div class="tip" id="tip" hidden role="status"></div>

<script>
(async function () {
'use strict';

/* ------------------------------------------------------------ utilidades */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null) continue; if (k === 'text') e.textContent = v; else e.setAttribute(k, v); }
  for (const c of kids.flat(Infinity)) if (c) e.append(c);
  return e;
}
const f0 = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const f1 = n => n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const dm = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const dmy = iso => dm(iso) + '/' + iso.slice(0, 4);
const median = a => { if (!a.length) return null; const b = [...a].sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + f0(Math.abs(n));
const plural = (n, one, many) => n === 1 ? one : many;
function niceTicks(max, count = 5) {
  const raw = max / count, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p, t = [];
  for (let v = 0; ; v += step) { t.push(Math.round(v * 1e6) / 1e6); if (v >= max) break; }
  return t;
}
function checkIcon() { return sv('svg', { width: 14, height: 14, viewBox: '0 0 16 16', 'aria-hidden': 'true' }, sv('path', { d: 'M3 8.5l3.2 3.2L13 4.8', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })); }

/* ------------------------------------------------------------ dados */
const view = $('#view'), tip = $('#tip');
let D;
try {
  const res = await fetch('data.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error(res.status);
  D = await res.json();
} catch (e) {
  view.replaceChildren(h('div', { class: 'card err', text: 'Não foi possível carregar data.json. Rode o pipeline (python run_pipeline.py) e abra a página por um servidor local (python -m http.server), não direto do arquivo.' }));
  $('#meta').textContent = '';
  return;
}
const C = D.resultCols, P = D.pitCols;
const R = D.results.map(a => ({ round: a[0], d: a[1], t: a[2], grid: a[3], pos: a[4], status: a[5], pr: a[6], ps: a[7], sp: a[8], pole: a[9], fl: a[10], info: a[11], pts: a[6] + a[7] }));
const PITS = D.pits.map(a => ({ round: a[0], d: a[1], t: a[2], lap: a[3], time: a[4] }));
const rounds = D.rounds, last = D.meta.lastRound, total = D.meta.totalRounds;
const rd = r => rounds[r - 1];
const dn = i => D.drivers[i].name, tn = i => D.teams[i].name;
const slotVar = i => i < 8 ? `var(--s${i + 1})` : 'var(--other)';
const winnerOf = r => R.find(x => x.round === r && x.pos === 1);

const state = {
  tab: 'geral', from: 1, to: last, metric: 'pts', table: false,
  sel: new Set([0, 1, 2, 3, 4, 5]), driver: 0, race: last,
  sort: { pilotos: { k: 'pts', dir: -1 }, equipes: { k: 'pts', dir: -1 } }
};
const TABS = [['geral', 'Visão geral'], ['pilotos', 'Pilotos'], ['equipes', 'Equipes'], ['corridas', 'Corridas'], ['pit-stops', 'Pit stops']];

const inRange = x => x.round >= state.from && x.round <= state.to;
const rows = () => R.filter(inRange);

/* ------------------------------------------------------------ agregações */
function aggDrivers(rs) {
  const S = D.drivers.map((_, i) => ({ i, pts: 0, w: 0, p: 0, pole: 0, fl: 0, dnf: 0, races: 0, gs: 0, gn: 0, fs: 0, fn: 0, gain: 0, gainN: 0, cnt: Array(26).fill(0), teams: new Map() }));
  for (const x of rs) {
    const a = S[x.d]; a.pts += x.pts;
    if (x.status !== 'DNS') a.races++;
    if (x.pos) { a.cnt[x.pos - 1]++; a.fs += x.pos; a.fn++; if (x.pos === 1) a.w++; if (x.pos <= 3) a.p++; }
    a.pole += x.pole; a.fl += x.fl; if (x.status === 'DNF') a.dnf++;
    if (x.grid) { a.gs += x.grid; a.gn++; }
    if (x.grid && x.pos) { a.gain += x.grid - x.pos; a.gainN++; }
    a.teams.set(x.t, (a.teams.get(x.t) || 0) + 1);
  }
  return S;
}
function aggTeams(rs) {
  const S = D.teams.map((_, i) => ({ i, pts: 0, w: 0, p: 0, pole: 0, dnf: 0, cnt: Array(26).fill(0), byDrv: new Map(), byRound: new Map() }));
  for (const x of rs) {
    const a = S[x.t]; a.pts += x.pts;
    a.byDrv.set(x.d, (a.byDrv.get(x.d) || 0) + x.pts);
    a.byRound.set(x.round, (a.byRound.get(x.round) || 0) + x.pts);
    if (x.pos) { a.cnt[x.pos - 1]++; if (x.pos === 1) a.w++; if (x.pos <= 3) a.p++; }
    a.pole += x.pole; if (x.status === 'DNF') a.dnf++;
  }
  return S;
}
const cmpCnt = (a, b) => { if (b.pts !== a.pts) return b.pts - a.pts; for (let k = 0; k < 26; k++) if (b.cnt[k] !== a.cnt[k]) return b.cnt[k] - a.cnt[k]; return a.i - b.i; };

    { k: 'grid', label: 'Grid', num: true, cell: x => x.grid ? 'P' + x.grid : h('span', { class: 'muted', text: 'box' }) },
    { k: 'gain', label: 'Δ', num: true, cell: x => { if (!x.grid || !x.pos) return h('span', { class: 'dash', text: '–' }); const g = x.grid - x.pos; return h('span', { class: 'gain ' + (g > 0 ? 'up' : g < 0 ? 'dn' : '') }, g > 0 ? '▲ ' : g < 0 ? '▼ ' : '', String(Math.abs(g))); } },
    { k: 'info', label: 'Resultado', cell: x => x.pos ? h('span', { class: 'muted', style: 'font-variant-numeric:tabular-nums', text: x.info || '–' }) : h('span', { class: 'muted', text: x.info || '' }) },
    { k: 'pts', label: 'Pts', num: true, cell: x => x.pts ? h('span', null, h('b', { text: f0(x.pts) }), x.ps ? h('span', { class: 'muted', text: ` (${x.ps} sprint)` }) : null) : h('span', { class: 'dash', text: '–' }) },
  ];
  const poleR = rs.find(x => x.pole), flR = rs.find(x => x.fl);
  return h('section', { class: 'card', style: 'margin-top:16px' },
    h('div', { class: 'card-head' }, h('div', null, h('h2', { text: `R${r} · ${rr.name}` }),
      h('p', { class: 'sub', text: `${dmy(rr.date)} · ${[rr.circuit, rr.city].filter(Boolean).join(', ')}${rr.laps ? ' · ' + rr.laps + ' voltas' : ''}${poleR ? ' · pole: ' + dn(poleR.d) : ''}${flR ? ' · volta mais rápida: ' + dn(flR.d) : ''}` }))),
    podium, dataTable(cols, rs));
}

/* ------------------------------------------------------------ pit stops */
function viewPit() {
  const ps = PITS.filter(inRange), CLAMP = 48, XMIN = 16;
  if (!ps.length) return [h('div', { class: 'card empty', text: 'Sem paradas no período escolhido.' })];
  const by = D.teams.map((_, i) => ({ i, list: ps.filter(p => p.t === i) })).filter(o => o.list.length).map(o => ({ ...o, med: median(o.list.map(p => p.time)) })).sort((a, b) => a.med - b.med);
  const fastest = ps.reduce((m, p) => p.time < m.time ? p : m), all = median(ps.map(p => p.time));
  const tiles = h('div', { class: 'tiles', style: 'grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px' },
    tile('Paradas no período', f0(ps.length), `${ps.filter(p => p.time < 25).length} abaixo de 25 s`),
    tile('Tempo mediano', [f1(all), h('small', { text: ' s' })], 'todas as equipes'),
    tile('Mais rápida', [f1(fastest.time), h('small', { text: ' s' })], `${dn(fastest.d)} · ${tn(fastest.t)} · R${fastest.round}`),
    tile('Equipe mais rápida', tn(by[0].i), `${f1(by[0].med)} s de mediana`));
  const box = h('div', { class: 'chart-box' });
  const excluded = D.meta.pitExcluded && state.from <= Math.max(...D.meta.pitExcludedRounds, 0) && state.to >= Math.min(...D.meta.pitExcludedRounds, 99);
  const card = h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('div', null, h('h2', { text: 'Tempo de pit stop por equipe' }), h('p', { class: 'sub', text: 'Cada ponto é uma parada; a barra marca a mediana. Equipes ordenadas da mais rápida à mais lenta.' }))),
    mount(box, w => pitDraw(by, w, CLAMP, XMIN)),
    h('p', { class: 'note', text: `Tempo de parada no box, em segundos. Pontos acima de ${CLAMP} s ficam na borda direita (a medida real aparece ao passar o mouse).${excluded ? ` Ficam de fora ${D.meta.pitExcluded} registros de cerca de ${D.meta.pitExcludedMinutes} minutos na rodada ${D.meta.pitExcludedRounds.join(', ')} (volta ${D.meta.pitExcludedLaps.join(', ')}): a prova foi interrompida com bandeira vermelha, e esse tempo é a espera no box.` : ''}` }));
  const top = [...ps].sort((a, b) => a.time - b.time).slice(0, 8).map((p, i) => ({ ...p, rank: i + 1 }));
  const cols = [
    { k: 'rank', label: '#', num: true, cell: p => h('span', { class: 'posb', text: String(p.rank) }) },
    { k: 'time', label: 'Tempo', num: true, cell: p => h('b', { text: f1(p.time).replace(/,(\d)$/, ',$1') + ' s' }) },
    { k: 'd', label: 'Piloto', cell: p => h('span', null, h('span', { class: 'name', text: dn(p.d) }), h('span', { class: 'under', text: tn(p.t) })) },
    { k: 'r', label: 'Corrida', cell: p => `R${p.round} · ${rd(p.round).name}` },
    { k: 'lap', label: 'Volta', num: true, cell: p => String(p.lap) },
  ];
  const fast = h('section', { class: 'card', style: 'margin-top:16px' }, h('div', { class: 'card-head' }, h('div', null, h('h2', { text: 'As 8 paradas mais rápidas' }), h('p', { class: 'sub', text: 'Dentro do período escolhido.' }))), dataTable(cols, top));
  return [tiles, card, fast];
}
function pitDraw(by, W, CLAMP, XMIN) {
  const compact = W < 560, labelW = compact ? 84 : 108, rightW = compact ? 50 : 64, rowH = 38, top = 6, bottom = 26;
  const H = top + by.length * rowH + bottom, iw = W - labelW - rightW;
  const x = v => labelW + (Math.min(v, CLAMP) - XMIN) / (CLAMP - XMIN) * iw;
  const svg = sv('svg', { class: 'chart', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Distribuição dos tempos de pit stop por equipe: ' + by.map(o => `${tn(o.i)} mediana ${f1(o.med)} segundos`).join(', ') });
  for (let v = XMIN; v <= CLAMP; v += 4) svg.append(sv('line', { class: v === XMIN ? 'axl' : 'gl', x1: x(v), x2: x(v), y1: top, y2: H - bottom }), sv('text', { class: 'tk', x: x(v), y: H - 8, 'text-anchor': 'middle', text: v + (v === CLAMP ? '+' : '') }));
  svg.append(sv('text', { class: 'tk', x: labelW + iw, y: H - 8, 'text-anchor': 'end', text: '' }));
  by.forEach((o, k) => {
    const cy = top + k * rowH + rowH / 2;
    const g = sv('g', null, sv('text', { class: 'tk-strong', x: 0, y: cy + 4, text: tn(o.i) }));
    o.list.forEach((p, j) => {
      const jit = (((j * 37 + p.round * 11) % 13) - 6) * 1.15, over = p.time > CLAMP;
      g.append(sv('circle', { cx: x(p.time), cy: cy + jit, r: 3, fill: over ? 'none' : 'var(--seq)', 'fill-opacity': over ? 0 : 0.42, stroke: over ? 'var(--seq)' : 'none', 'stroke-width': over ? 1.5 : 0 }));
    });
    g.append(sv('rect', { x: x(o.med) - 1.5, y: cy - 13, width: 3, height: 26, rx: 1.5, fill: 'var(--ink)' }),
      sv('text', { class: 'lbl', x: W - rightW + 10, y: cy + 4, text: f1(o.med) + ' s' }));
    const hit = sv('rect', { x: labelW - 6, y: top + k * rowH, width: iw + 12, height: rowH, fill: 'transparent' });
    hit.addEventListener('pointermove', e => {
      const b = svg.getBoundingClientRect(), px = e.clientX - b.left;
      let best = null, bd = 1e9;
      for (const p of o.list) { const dd = Math.abs(x(p.time) - px); if (dd < bd) { bd = dd; best = p; } }
      if (best && bd < 14) tipShow(e.clientX, e.clientY, tipBody(`${f1(best.time)} s · ${dn(best.d)}`, `${tn(o.i)} · R${best.round} ${rd(best.round).name} · volta ${best.lap}`, [{ l: 'Mediana da equipe', v: f1(o.med) + ' s' }]));
      else tipShow(e.clientX, e.clientY, tipBody(tn(o.i), `${o.list.length} paradas no período`, [{ l: 'Mediana', v: f1(o.med) + ' s' }, { l: 'Mais rápida', v: f1(Math.min(...o.list.map(p => p.time))) + ' s' }]));
    });
    hit.addEventListener('pointerleave', tipHide);
    g.append(hit); svg.append(g);
  });
  return svg;
}

/* ------------------------------------------------------------ moldura: abas, filtros, rodapé */
function drawTabs() {
  $('#tabs').replaceChildren(...TABS.map(([id, label]) => h('button', { class: 'tab', role: 'tab', type: 'button', id: 'tab-' + id, 'aria-selected': String(state.tab === id), onclick: () => { location.hash = id; } }, label)));
}
function drawFilters() {
  const f = $('#filters'); f.hidden = state.tab === 'corridas';
  if (f.hidden) return;
  const opt = (v, cur) => h('option', { value: v, selected: v === cur ? true : null }, `R${v} · ${rd(v).name}`);
  const opts = cur => Array.from({ length: last }, (_, i) => opt(i + 1, cur));
  const preset = (label, from) => h('button', { type: 'button', 'aria-pressed': String(state.from === from && state.to === last), onclick: () => { state.from = from; state.to = last; render(); } }, label);
  f.replaceChildren(
    h('div', { class: 'f-group' }, h('label', { class: 'f-label', for: 'f-from', text: 'De' }), h('select', { id: 'f-from', onchange: e => { state.from = +e.target.value; if (state.to < state.from) state.to = state.from; render(); } }, opts(state.from))),
    h('div', { class: 'f-group' }, h('label', { class: 'f-label', for: 'f-to', text: 'Até' }), h('select', { id: 'f-to', onchange: e => { state.to = +e.target.value; if (state.from > state.to) state.from = state.to; render(); } }, opts(state.to))),
    h('div', { class: 'seg-ctl', role: 'group', 'aria-label': 'Atalhos de período' }, preset('Temporada', 1), preset('Últimas 10', Math.max(1, last - 9)), preset('Últimas 5', Math.max(1, last - 4))),
    h('span', { class: 'range-note', text: state.from === 1 && state.to === last ? `Temporada inteira · ${last} de ${total} corridas` : `${state.to - state.from + 1} ${plural(state.to - state.from + 1, 'corrida', 'corridas')} · R${state.from} a R${state.to}` }));
}
function drawChrome() {
  const m = D.meta;
  $('#meta').replaceChildren(h('div', null, h('b', { text: `Até R${last} · ${rd(last).name}` }), ` · ${total - last} ${plural(total - last, 'corrida restante', 'corridas restantes')}`), h('div', { text: `Dados F1DB ${m.release} · ${dmy(m.commitDate)}` }));
  $('#foot').replaceChildren(
    h('div', null, 'Fonte: ', h('a', { href: m.source, target: '_blank', rel: 'noopener', text: 'F1DB' }), ` (${m.release}, commit ${m.commit}), licença ${m.license}. Referências para auditoria: `, h('a', { href: 'https://en.wikipedia.org/wiki/2026_Formula_One_World_Championship', target: '_blank', rel: 'noopener', text: 'Wikipedia' }), ' (classificação conferida na R17), ', h('a', { href: 'https://www.planetf1.com/news/f1-championship-standings-2026-las-vegas-grand-prix', target: '_blank', rel: 'noopener', text: 'PlanetF1' }), ' (conferida na R21) e a ', h('a', { href: 'https://www.formula1.com/en/results', target: '_blank', rel: 'noopener', text: 'página oficial de resultados' }), '.'),
    h('div', { text: 'Título decidido: a vantagem do líder passa o máximo de pontos que ainda restam (25 por vitória, 43 por corrida para construtores, mais 8 e 15 em fins de semana com sprint). Ordem de desempate pela contagem de melhores resultados.' }),
    h('div', { text: 'Pipeline em Python (pandas) · painel gerado a partir de data.json.' }));
}

const views = { geral: viewGeral, pilotos: viewPilotos, equipes: viewEquipes, corridas: viewCorridas, 'pit-stops': viewPit };
function render() {
  const y = window.scrollY;
  observers.forEach(o => o.disconnect()); observers = []; pending = []; tipHide();
  drawTabs(); drawFilters();
  const nodes = views[state.tab]();
  view.replaceChildren(...[].concat(nodes));
  pending.forEach(fn => fn());
  window.scrollTo(0, y);
}
function route() {
  const id = location.hash.replace('#', '');
  state.tab = views[id] ? id : 'geral';
  render();
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => { if (e.key === 'Escape') tipHide(); });
drawChrome(); route();
})();
</script>
